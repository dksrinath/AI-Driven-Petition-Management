{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card auth-card mt-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 text-center"><i class="fas fa-lock me-2"></i>Forgot Password</h4>
            </div>
            <div class="card-body">
                <p class="text-center mb-4">Enter your email address below to receive a password reset link.</p>
                <form method="post" action="{{ url_for('forgot_password') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Send Reset Link</button>
                    </div>
                </form>
                <hr>
                <div class="text-center">
                    <p>Remember your password? <a href="{{ url_for('login') }}">Login</a></p>
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
